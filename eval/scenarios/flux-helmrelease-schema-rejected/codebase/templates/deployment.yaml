apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
    spec:
      containers:
        - name: checkout
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: PAYMENT_ENDPOINT
              value: {{ .Values.paymentProvider.endpoint | quote }}
            - name: PAYMENT_TIMEOUT_SECONDS
              value: {{ .Values.paymentProvider.timeoutSeconds | quote }}
            - name: PAYMENT_MAX_RETRIES
              value: {{ .Values.paymentProvider.maxRetries | quote }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
