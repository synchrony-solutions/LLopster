replicaCount: 3

image:
  repository: ghcr.io/example-org/checkout
  # Bumped for 1.4.3 alongside the new payment-provider client.
  tag: "3.2.0"
  pullPolicy: IfNotPresent

paymentProvider:
  # New in 3.2.0: the client retries idempotent calls itself.
  endpoint: https://payments.internal.example.org
  timeoutSeconds: 8
  maxRetries: 4

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 512MB

podDisruptionBudget:
  enabled: true
  minAvailable: 2
