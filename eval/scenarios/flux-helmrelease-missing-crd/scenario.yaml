id: flux-helmrelease-missing-crd
description: >-
  The checkout HelmRelease will not become Ready after a chart bump to 1.4.3.
  Helm rejects the upgrade before applying anything: the new chart renders a
  ServiceMonitor, and this cluster has no Prometheus Operator CRDs. The
  previous release (1.4.2) keeps running and is healthy — no crash loop, no
  error logs, no metric anomaly.

  The cause exists only in the cluster. Nothing in the codebase says the CRD
  is missing, so it cannot be derived from source; the HelmRelease's Ready
  condition message is the only evidence. (The first draft of this scenario
  used a values-schema violation, and a control run solved it by checking
  values.yaml against values.schema.json — a schema failure is derivable from
  source by construction.)

  The 1.4.3 bump offers several equally plausible failure stories: a new
  payment-provider credentials Secret reference (a missing Secret is a classic
  failed rollout), an HPA replacing the fixed replica count, a new metrics
  port and ServiceMonitor, and an image bump. Without the condition message
  the model has to guess among them.

  The condition message is assembled from the real format strings, each read
  from source: helm-controller internal/reconcile/upgrade.go
  ("Helm upgrade failed for release %s/%s with chart %s@%s: %s"), Helm
  pkg/action/upgrade.go ("unable to build kubernetes objects from new release
  manifest: %w"), cli-runtime pkg/resource/mapper.go ("resource mapping not
  found for name: %q namespace: %q from %q: %w\nensure CRDs are installed
  first") and apimachinery meta/errors.go ("no matches for kind %q in version
  %q").

  The repo-side fix is metrics.serviceMonitor.enabled: false in values.yaml
  (installing the CRDs is the other fix, and is not a change to this repo).

  Control: replay with `cluster_state` removed. The alert then carries only
  its labels (ready=False, revision) and the `## GitOps resource` block —
  enough to know a HelmRelease is failing, not why.

# Self-contained fixture.
service:
  name: checkout
  codebase_path: codebase
  github_repo: example-org/checkout

alert:
  version: "4"
  status: firing
  receiver: agent-webhook
  groupLabels:
    alertname: FluxHelmReleaseNotReady
  alerts:
    - status: firing
      labels:
        alertname: FluxHelmReleaseNotReady
        severity: warning
        service: checkout
        llopster_managed: "true"
        # gotk_resource_info, as Flux's reference kube-state-metrics config
        # exports it; namespace/pod/job/instance are kube-state-metrics' own.
        customresource_group: helm.toolkit.fluxcd.io
        customresource_kind: HelmRelease
        customresource_version: v2
        exported_namespace: prod
        name: checkout
        ready: "False"
        revision: 1.4.2
        chart_name: checkout
        chart_app_version: 3.1.4
        chart_source_name: example-charts
        namespace: monitoring
        pod: kube-prometheus-stack-kube-state-metrics-7c9d5f-xk2lp
        job: kube-state-metrics
        instance: 10.0.3.17:8080
      annotations:
        summary: HelmRelease prod/checkout is not ready
        description: >-
          Flux HelmRelease prod/checkout has reported Ready=False for more
          than 10 minutes.
      startsAt: "2026-10-03T14:00:00.000Z"
      endsAt: "0001-01-01T00:00:00Z"
      generatorURL: "http://localhost:9090/graph?g0.expr=gotk_resource_info%7Bcustomresource_kind%3D%22HelmRelease%22%2Cexported_namespace%3D%22prod%22%2Cname%3D%22checkout%22%2Cready%3D%22False%22%7D%20%3D%3D%201&g0.tab=1"

recorded_context:
  # The running 1.4.2 pods are healthy and the rejected upgrade never applied
  # anything, so there is nothing in the workload's logs.
  log_lines: []
  metric_samples:
    - metric:
        __name__: gotk_resource_info
        customresource_kind: HelmRelease
        exported_namespace: prod
        name: checkout
        ready: "False"
      value: 1
  cluster_state:
    namespace: prod
    objects_queried: [HelmRelease/checkout, HelmChart/prod-checkout]
    gitops:
      resolved_from: alert labels
      objects:
        - kind: HelmRelease
          namespace: prod
          name: checkout
          api_version: helm.toolkit.fluxcd.io/v2
          conditions:
            - type: Ready
              status: "False"
              reason: UpgradeFailed
              message: |-
                Helm upgrade failed for release prod/checkout with chart checkout@1.4.3: unable to build kubernetes objects from new release manifest: resource mapping not found for name: "checkout" namespace: "" from "": no matches for kind "ServiceMonitor" in version "monitoring.coreos.com/v1"
                ensure CRDs are installed first
            - type: Released
              status: "False"
              reason: UpgradeFailed
              message: Helm upgrade failed for release prod/checkout with chart checkout@1.4.3
          applied_revision: 1.4.2
          attempted_revision: 1.4.3
          releases:
            - {chart_version: 1.4.2, app_version: 3.1.4, status: deployed, last_deployed: "2026-09-18T10:12:00Z"}
            - {chart_version: 1.4.1, app_version: 3.1.4, status: superseded, last_deployed: "2026-09-02T08:40:00Z"}
          facts:
            chart: checkout (version constraint 1.4.x)
            chart source: HelmRepository/example-charts
            driftDetection: disabled
            upgradeFailures: "3"
            failures: "3"
            lastAttemptedReleaseAction: upgrade
          source: {kind: HelmChart, namespace: flux-system, name: prod-checkout}
        - kind: HelmChart
          namespace: flux-system
          name: prod-checkout
          api_version: source.toolkit.fluxcd.io/v1
          conditions:
            - {type: Ready, status: "True", reason: ChartPullSucceeded, message: "pulled 'checkout' chart with version '1.4.3'"}
          applied_revision: 1.4.3
          facts:
            chart: checkout
            version constraint: 1.4.x
      events:
        - involved_object: HelmRelease/checkout
          reason: UpgradeFailed
          message: "Helm upgrade failed for release prod/checkout with chart checkout@1.4.3: unable to build kubernetes objects from new release manifest"
          count: 3

ground_truth:
  expect_patch: true
  expected_files: [values.yaml]
  # Graded on the Root Cause section. The competing stories this scenario
  # offers (the credentials Secret, the HPA, the image) have no reason to name
  # the ServiceMonitor.
  root_cause_keywords: ["ServiceMonitor"]
