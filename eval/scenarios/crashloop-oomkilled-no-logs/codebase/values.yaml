replicaCount: 3

image:
  repository: ghcr.io/example-org/ledger-worker
  tag: "2.4.0"

resources:
  requests:
    cpu: 100m
    memory: 192Mi
  limits:
    cpu: "1"
    memory: 384Mi

# The worker rebuilds its account-code cache before it can serve. See
# CACHE_WARM_SECONDS in worker.py — the probe budget has to cover it.
livenessProbe:
  initialDelaySeconds: 5
  periodSeconds: 10
  failureThreshold: 3

env:
  BATCH_SIZE: "25000"
  LOG_LEVEL: "warning"
