# Dependabot — dependency + action-pin freshness.
#
# github-actions updates keep the SHA-pinned `uses:` lines in workflows current
# (Dependabot understands `sha # vX.Y.Z` pins and bumps both together).
#
# demo-app/ is deliberately excluded: it's the intentionally-buggy demo target,
# and dependency-update PRs against it are noise.

version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    groups:
      python-minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
