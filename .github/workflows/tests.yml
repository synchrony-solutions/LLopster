name: Tests

# Runs the Python unit/integration suite on every PR. Tests use
# sqlite+aiosqlite in-memory and mocked HTTP/Anthropic clients (no live API
# calls, no external services), so the job needs nothing but pip.

# No path filter on pull_request: `pytest` is a required status check in the
# main-branch ruleset, and a path-filtered workflow that never triggers never
# reports — which would leave e.g. docs-only PRs unmergeable. The suite is
# fully mocked and fast, so running it on every PR is cheap.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Least-privilege token: this workflow only reads the repo. Nothing here
# should ever write back (comments, releases, packages).
permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest tests/ -q

      # Single source of truth for the test-count figures quoted in the docs:
      # the number is derived from what pytest collects, so README/CLAUDE/ROADMAP
      # can't drift. Fails the build if a doc is stale — run
      # `python scripts/sync_test_count.py` locally and commit the result.
      - name: Check docs test count is in sync
        run: python scripts/sync_test_count.py --check
