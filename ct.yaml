# chart-testing (ct) configuration — consumed by .github/workflows/helm-ci.yml.
# Docs: https://github.com/helm/chart-testing
target-branch: main
chart-dirs:
  - .
# The chart lives at ./helm-chart (single chart, not a charts/ monorepo).
# Bundled observability deps are pulled from these repos during `ct lint`.
chart-repos:
  - prometheus-community=https://prometheus-community.github.io/helm-charts
  - grafana=https://grafana.github.io/helm-charts
# Chart.yaml now declares maintainers, so that gate is on: ct verifies each
# listed maintainer resolves to a real GitHub account, which keeps the block
# from silently rotting as the team changes.
validate-maintainers: true
# Still off: the chart version is tied to appVersion and bumped at release
# time, not on every PR that touches helm-chart/.
check-version-increment: false
helm-extra-args: --timeout 600s
