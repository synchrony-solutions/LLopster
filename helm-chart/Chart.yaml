apiVersion: v2
# Lowercase on purpose: the chart is published to an OCI registry
# (oci://ghcr.io/synchrony-solutions/charts/llopster) and OCI repository
# names must be lowercase. Only the cosmetic helm.sh/chart label depends on
# this — resource names and selectors are static (app: llopster-*).
name: llopster
description: |
  LLopster agent + dashboard, with optional bundled observability stack
  (Prometheus, AlertManager, Loki) for evaluation. In production, set
  prometheus.bundled=false and loki.bundled=false and point LLopster at
  your existing observability via prometheus.url / loki.url.
type: application
version: 1.2.0
appVersion: "1.2.0"

# API floor, derived from what templates/ actually renders: apps/v1,
# networking.k8s.io/v1 Ingress (stable in 1.19), and core v1. The
# monitoring.coreos.com/v1 ServiceMonitor is opt-in and CRD-gated, so it does
# not move this floor. Helm refuses to install below this.
kubeVersion: ">=1.19.0-0"

keywords:
  - sre
  - observability
  - prometheus
  - loki
  - alertmanager
  - incident-response
  - llm
  - ai

home: https://github.com/synchrony-solutions/LLopster
# `sources` is what Helm maps to the OCI annotation
# org.opencontainers.image.source when pushing to a registry. Without it the
# published chart package does NOT link back to this repository on ghcr, which
# means it does not inherit the repo's visibility and has to be flipped to
# public by hand. Keep this pointing at the repo.
sources:
  - https://github.com/synchrony-solutions/LLopster
# Org avatar — stands in until a dedicated logo asset exists. Swap for a
# stable, versioned URL (e.g. a raw.githubusercontent.com path to a committed
# SVG) when there is one.
icon: https://avatars.githubusercontent.com/u/219000890?v=4

# Required by `validate-maintainers` in ct.yaml. Mirrors the
# @synchrony-solutions/llopster-maintainers team that CODEOWNERS routes
# reviews to — keep the two in sync.
maintainers:
  - name: braswent
    url: https://github.com/braswent
  - name: fenimors
    url: https://github.com/fenimors
  - name: jocobtt
    url: https://github.com/jocobtt

dependencies:
  # Bundled observability. Toggled by prometheus.bundled / loki.bundled in
  # values.yaml. AlertManager rides with bundled Prometheus (no separate
  # toggle); in BYO mode the customer's existing AlertManager forwards to
  # LLopster's webhook via the integration-recipes snippet.
  - name: prometheus
    version: "29.5.0"
    repository: https://prometheus-community.github.io/helm-charts
    condition: prometheus.bundled
  - name: alertmanager
    version: "1.35.1"
    repository: https://prometheus-community.github.io/helm-charts
    condition: prometheus.bundled
  - name: loki
    version: "6.55.0"
    repository: https://grafana.github.io/helm-charts
    condition: loki.bundled
  # PostgreSQL is deployed via templates/postgres.yaml (official
  # postgres:17-alpine image).
