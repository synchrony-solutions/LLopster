# =============================================================================
# LLopster — Helm chart values
#
# This chart deploys the LLopster agent + dashboard and (optionally) a
# self-contained observability stack for evaluation. In production, most
# users connect LLopster to their cluster's existing Prometheus + Loki +
# AlertManager via the BYO toggles below.
#
# Install modes
# -------------
# - BUNDLED (POC / evaluation):
#     prometheus.bundled: true
#     loki.bundled: true
#   The chart installs prometheus-community/prometheus + prometheus-community/
#   alertmanager + grafana/loki and wires them to the agent automatically.
#
# - BYO observability (production — recommended):
#     prometheus.bundled: false
#     prometheus.url: http://<your-prom-svc>.<ns>.svc.cluster.local:9090
#     loki.bundled: false
#     loki.url: http://<your-loki-svc>.<ns>.svc.cluster.local:3100
#   Then configure your existing AlertManager to send to LLopster's webhook
#   (see helm-chart/docs/integration-recipes/alertmanager-receiver.yaml).
#
# - HYBRID (e.g. you have Prom but not Loki):
#   Set each `bundled:` flag independently.
#
# Cluster-specific overrides
# --------------------------
# Storage classes, ingress hostnames, image-pull credentials, and dev-cluster
# servicesConfig entries live in `values.dev.yaml` (gitignored from the
# perspective of customer installs — they layer their own values on top).
# Layered install:
#
#   helm upgrade llopster ./helm-chart \
#     -f helm-chart/values.yaml \
#     -f helm-chart/values.dev.yaml \    # only for the dev cluster
#     -f helm-chart/values.secret.yaml
# =============================================================================

# ---------------------------------------------------------------------------
# Ingress — opt-in HTTP routes for cluster operators. Disabled by default;
# the dashboard and agent webhook only need in-cluster DNS.
# ---------------------------------------------------------------------------
ingress:
  className: ""
  annotations: {}
  services:
    prometheus:
      enabled: false
      host: ""
      tailhost: ""
      service: prometheus-server
      port: 80
    alertmanager:
      enabled: false
      host: ""
      tailhost: ""
      service: alertmanager
      port: 9093
    loki:
      enabled: false
      host: ""
      tailhost: ""
      service: loki
      port: 3100
    agent:
      enabled: false
      host: ""
      tailhost: ""
      service: llopster-agent
      port: 8000
    dashboard:
      enabled: false
      host: ""
      tailhost: ""
      service: llopster-dashboard
      port: 8000

# ---------------------------------------------------------------------------
# Image pull secret (e.g. ghcr.io for private packages). Set
# imagePullSecret.enabled=false and clear the values if your images are
# public.
# ---------------------------------------------------------------------------
imagePullSecret:
  enabled: false
  name: regcred
  registry: ghcr.io
  username: ""
  password: ""
  email: ""

# ===========================================================================
# Observability — Prometheus
#
# bundled: true  → chart installs prometheus-community/prometheus +
#                  prometheus-community/alertmanager as subcharts. Useful for
#                  evaluation and the local POC; not recommended for prod.
# bundled: false → chart skips both subcharts; configure `url` to point at
#                  your existing Prometheus query API. Wire your existing
#                  AlertManager at LLopster's webhook via the
#                  helm-chart/docs/integration-recipes/alertmanager-receiver.yaml
#                  snippet.
# ===========================================================================
prometheus:
  bundled: true
  # Only consulted when bundled: false. Use the in-cluster DNS of your
  # existing Prometheus query API.
  # Example (kube-prometheus-stack default service name):
  #   url: http://kube-prom-stack-kube-prome-prometheus.monitoring.svc.cluster.local:9090
  url: ""

  # Subchart values (consumed only when bundled: true).
  alertmanager:
    # Disable the embedded one — we deploy the standalone subchart below
    # so the keys stay explicit.
    enabled: false
  prometheus-pushgateway:
    enabled: false
  kube-state-metrics:
    enabled: true
  prometheus-node-exporter:
    enabled: true
  server:
    fullnameOverride: prometheus-server
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    retention: "15d"
    persistentVolume:
      enabled: true
      size: 8Gi
      accessModes:
        - ReadWriteOnce
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 1000m
        memory: 1Gi
    service:
      type: ClusterIP
      servicePort: 80
  serverFiles:
    prometheus.yml:
      alerting:
        alertmanagers:
          - static_configs:
              - targets:
                  - alertmanager:9093
    # Minimal smoke-test alerts so a bundled-mode install fires something.
    # Real alerts (per-service and cross-cutting) live in either:
    #   - the per-service helm chart (e.g. demo-app's PrometheusRule), or
    #   - LLopster's starter pack PrometheusRule (alertRules.enabled below)
    # which only works under the Prometheus Operator. Bundled mode here is
    # operator-less, so we ship two minimal rules inline.
    alerting_rules.yml:
      groups:
        - name: llopster-bundled-smoketest
          interval: 30s
          rules:
            - alert: AlwaysFiringDemoAlert
              expr: vector(1)
              for: 1m
              labels:
                severity: warning
                service: demo
              annotations:
                summary: "Bundled-mode smoke test — alert plumbing reachable"
                description: "Intentionally always firing so you can verify the agent receives webhook payloads end-to-end."

            - alert: PrometheusTargetDown
              expr: up == 0
              for: 2m
              labels:
                severity: critical
              annotations:
                summary: "Prometheus target {{ $labels.job }} is down"
                description: "Target {{ $labels.instance }} for job {{ $labels.job }} has been unreachable for 2 minutes."
  extraScrapeConfigs: |
    - job_name: loki
      static_configs:
        - targets:
            - loki:3100

# ===========================================================================
# AlertManager — paired with bundled Prometheus.
#
# Riding behind prometheus.bundled by convention (no separate toggle); when
# bundled Prometheus is off, the customer's existing AlertManager handles
# routing and forwards to LLopster's webhook via the integration-recipes
# snippet.
# ===========================================================================
alertmanager:
  fullnameOverride: alertmanager
  replicaCount: 1
  persistence:
    enabled: true
    size: 1Gi
    accessModes:
      - ReadWriteOnce
  service:
    type: ClusterIP
    port: 9093
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi
  config:
    global:
      resolve_timeout: 5m
    route:
      receiver: agent-webhook
      group_by: ['alertname', 'service']
      group_wait: 10s
      group_interval: 30s
      repeat_interval: 5m
    receivers:
      - name: agent-webhook
        webhook_configs:
          - url: http://llopster-agent:8000/webhook
            send_resolved: true
    inhibit_rules: []
    templates: []

# ===========================================================================
# Observability — Loki
# bundled: true  → chart installs grafana/loki (single-binary mode).
# bundled: false → chart skips the subchart; configure `url` to point at
#                  your existing Loki query API.
# ===========================================================================
loki:
  bundled: true
  # Only consulted when bundled: false. Example for a customer's Loki:
  #   url: http://loki.monitoring.svc.cluster.local:3100
  url: ""

  # Subchart values (consumed only when bundled: true).
  fullnameOverride: loki
  deploymentMode: SingleBinary
  loki:
    auth_enabled: false
    commonConfig:
      replication_factor: 1
      path_prefix: /var/loki
    storage:
      type: filesystem
    schemaConfig:
      configs:
        - from: "2024-01-01"
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h
    limits_config:
      allow_structured_metadata: true
      retention_period: 168h
    rulerConfig:
      alertmanager_url: http://alertmanager:9093
    pattern_ingester:
      enabled: false
  singleBinary:
    replicas: 1
    persistence:
      enabled: true
      size: 10Gi
      accessModes:
        - ReadWriteOnce
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 1000m
        memory: 1Gi
  gateway:
    enabled: false
  read:
    replicas: 0
  write:
    replicas: 0
  backend:
    replicas: 0
  chunksCache:
    enabled: false
  resultsCache:
    enabled: false
  test:
    enabled: false
  lokiCanary:
    enabled: false
  monitoring:
    selfMonitoring:
      enabled: false
      grafanaAgent:
        installOperator: false
    lokiCanary:
      enabled: false
    serviceMonitor:
      enabled: false

# ===========================================================================
# LLopster-curated alert rules (starter pack)
#
# Ships a small set of cross-cutting infra alerts as a PrometheusRule CRD.
# Each rule carries llopster.io/* annotations that the agent prompt can
# surface for better patch quality (likely-files hints, runbook prose).
#
# IMPORTANT: requires the Prometheus Operator (kube-prometheus-stack). If
# you're running raw Prometheus, paste the equivalent rules from
# helm-chart/docs/integration-recipes/prometheus-rules-snippet.yaml into
# your prometheus.yml manually instead.
#
# Default: off. Production teams almost always have their own alerting
# regime; this is opt-in additive.
# ===========================================================================
alertRules:
  enabled: false
  # Operator's ruleSelector label set — kube-prometheus-stack defaults to
  # {release: <kps-release-name>}. Adjust to match yours.
  labels: {}
  interval: 30s

# ===========================================================================
# External database — used when postgresql.enabled=false.
#
# The production path for a managed instance (RDS, Cloud SQL, Azure Database)
# instead of running a second stateful Postgres in-cluster. Point this at a
# Secret holding the full SQLAlchemy connection URL:
#
#   postgresql+asyncpg://<user>:<password>@<host>:5432/<database>
#
# Typically produced by External Secrets from AWS Secrets Manager, so the URL
# — which contains a password — never enters a values file.
#
# With postgresql.enabled=false the chart REFUSES TO RENDER unless this or an
# agent.env.DATABASE_URL passthrough is set. That is deliberate: the app's
# fallback is a SQLite file under /app/data, and that write fails against the
# chart's own readOnlyRootFilesystem — so the old silent fallback could only
# ever produce a crash-loop.
# ===========================================================================
externalDatabase:
  # Name of an existing Secret in the release namespace.
  existingSecret: ""
  # Key within that Secret holding the connection URL.
  secretKey: DATABASE_URL

# ===========================================================================
# PostgreSQL — shared DB for agent and dashboard. Deployed via
# templates/postgres.yaml (official postgres:17-alpine image).
#
# enabled: false → the chart deploys no database; configure externalDatabase
#                  above (see the render-time guard described there).
# ===========================================================================
postgresql:
  enabled: true
  fullnameOverride: llopster-postgres
  global:
    security:
      allowInsecureImages: true
  auth:
    username: llopster
    # CHANGEME — supply via values.secret.yaml at install time.
    password: CHANGEME-app-password
    database: llopster
    # Externally-managed credentials for the bundled PostgreSQL. When set, the
    # chart renders no postgres Secret and reads everything from yours, which
    # must carry FOUR keys — the StatefulSet consumes the first three via
    # envFrom, and the agent + dashboard read the fourth:
    #   POSTGRES_DB, POSTGRES_USER, POSTGRES_PASSWORD, DATABASE_URL
    # DATABASE_URL is the full SQLAlchemy URL, e.g.
    #   postgresql+asyncpg://<user>:<password>@llopster-postgres:5432/<db>
    # (An External Secrets template can compose it from the same source
    # fields.) The username/password/database above are then ignored.
    existingSecret: ""
  image:
    repository: postgres
    tag: "17-alpine"
    pullPolicy: IfNotPresent
  # Init container that prepares the data volume's ownership before postgres
  # starts (see templates/postgres.yaml for the NFS rationale). Parameterized
  # for the same reason as every other image in the chart: a cluster
  # restricted to a private mirror cannot pull from Docker Hub.
  initImage:
    repository: busybox
    tag: "1.36"
    pullPolicy: IfNotPresent
  primary:
    persistence:
      enabled: true
      size: 5Gi
      accessModes:
        - ReadWriteOnce
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

# ---------------------------------------------------------------------------
# llopster-agent (the FastAPI webhook + Claude orchestration service)
# Templates: templates/llopster-agent.yaml
# ---------------------------------------------------------------------------
agent:
  enabled: true

  # Secure-by-default escape hatch. The chart REFUSES to render when an Ingress
  # (agent or dashboard) is enabled but agent.secrets.LLOPSTER_API_TOKEN is
  # empty — an exposed install would leave /webhook + trigger + settings
  # UNAUTHENTICATED while holding a write-scoped GitHub PAT. Set this to true
  # ONLY for an explicitly trusted / local-only deploy where you accept an
  # unauthenticated inbound surface (the agent still logs a loud startup
  # warning). The supported production path is to set LLOPSTER_API_TOKEN.
  allowUnauthenticated: false

  # LLM provider. Selects how the agent reaches Claude.
  #   provider: anthropic  → the direct Anthropic API, keyed by
  #                          agent.secrets.ANTHROPIC_API_KEY (the default).
  #   provider: bedrock    → Claude via AWS Bedrock. No Anthropic key needed;
  #                          credentials come from the pod's ServiceAccount
  #                          IRSA role (set agent.serviceAccount.annotations
  #                          — recommended) or the optional static AWS keys
  #                          under agent.secrets.
  # The one image supports both; nothing else changes when you flip this.
  llm:
    provider: anthropic
    bedrock:
      # REQUIRED when provider=bedrock (the chart fails to render without it).
      region: ""
      # Bedrock inference-profile model IDs. These differ from the direct-API
      # names (agent.env.ANTHROPIC_MODEL etc.) — override to match the models
      # enabled in your account/region. The `us.` prefix is the US
      # cross-region inference profile; use `eu.` / `apac.` as appropriate.
      model: us.anthropic.claude-opus-4-7-v1:0
      triageModel: us.anthropic.claude-haiku-4-5-v1:0
      investigationModel: us.anthropic.claude-sonnet-4-6-v1:0

  # ServiceAccount for the agent pod. The recommended way to grant Bedrock
  # access on EKS is IRSA / pod-identity: create the SA here and annotate it
  # with the IAM role ARN that allows `bedrock:InvokeModel` — no static keys
  # ever touch the cluster. Harmless (no annotations) for the Anthropic API
  # provider. Set create=false + name to reuse an externally-managed SA.
  serviceAccount:
    create: true
    # Defaults to "llopster-agent" when empty.
    name: ""
    annotations: {}
    #   eks.amazonaws.com/role-arn: arn:aws:iam::<account-id>:role/<bedrock-role>

  # Notification channel for patch proposals.
  #   provider: slack  → Slack incoming webhook (agent.secrets.SLACK_WEBHOOK_URL)
  #   provider: teams  → Microsoft Teams via a Power Automate Workflows webhook
  #                      (agent.secrets.TEAMS_WEBHOOK_URL — REQUIRED when teams,
  #                      the chart fails to render without it)
  #   provider: none   → notifications disabled (no messaging system)
  # Back-compat: default "slack" keeps existing SLACK_WEBHOOK_URL installs
  # unchanged. See docs for creating the Teams Workflow that yields the URL.
  notifications:
    provider: slack

  # Optional NetworkPolicy restricting who can reach the agent's webhook/API
  # port (8000) to in-cluster sources. Opt-in: it only takes effect on a CNI
  # that enforces NetworkPolicy, and a too-strict policy would drop AlertManager
  # deliveries. The agent's OWN namespace is always allowed (the dashboard
  # proxy + a same-namespace AlertManager); add the namespace your AlertManager
  # (and, if you expose the trigger UI, your ingress controller) runs in.
  networkPolicy:
    enabled: false
    allowedNamespaces: []
    # Example (BYO observability in the `monitoring` namespace):
    # allowedNamespaces:
    #   - monitoring

  image:
    repository: ghcr.io/synchrony-solutions/llopster
    # Empty ⇒ the template falls back to Chart.appVersion, so the default tag
    # always matches a published release image (push-images.sh publishes the
    # appVersion tag alongside `latest`). Set an explicit tag (e.g. a git SHA)
    # to pin a specific build.
    tag: ""
    pullPolicy: IfNotPresent

  replicas: 1

  service:
    type: ClusterIP
    port: 8000

  # Opt-in Prometheus Operator ServiceMonitor for the agent's /metrics endpoint
  # (self-observability: run counts by status, backlog depth, trailing-day
  # spend, cost-breaker state). Requires the Prometheus Operator CRDs
  # (kube-prometheus-stack) in the cluster. Off by default so a cluster without
  # the CRD still installs.
  serviceMonitor:
    enabled: false
    # Scrape cadence.
    interval: 30s
    scrapeTimeout: 10s
    # Extra labels so the Prometheus Operator's serviceMonitorSelector matches
    # it (e.g. {release: kube-prometheus-stack}). Leave empty if your Operator
    # selects all ServiceMonitors.
    labels: {}

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi

  # Security hardening. Defaults follow the restricted Pod Security Standard:
  # run as a non-root UID, drop every Linux capability, forbid privilege
  # escalation, and mount the root filesystem read-only (the template mounts a
  # writable emptyDir at /tmp and sets HOME=/tmp for the few libs that need
  # scratch space). Safe with the chart default postgresql.enabled=true, which
  # routes the DB to PostgreSQL (no SQLite file written under /app). If you set
  # postgresql.enabled=false you MUST point DATABASE_URL at an external DB —
  # the SQLite fallback writes to /app/data and would fail on a read-only root.
  # Override per-field if your environment mandates a specific UID/GID.
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL

  # Non-secret env vars. PROMETHEUS_URL and LOKI_URL are no longer set
  # here — they're derived from the top-level `prometheus` and `loki`
  # blocks (bundled svc DNS when bundled: true, the .url field otherwise).
  env:
    SERVICE: agent
    ANTHROPIC_MODEL: claude-opus-4-7
    PATCH_CONFIDENCE_THRESHOLD: "4"
    LOG_LOOKBACK_MINUTES: "30"
    MAX_LOG_LINES: "200"
    SERVICES_CONFIG: /etc/llopster/services.yaml
    # Least-privilege posture: open LLM-authored PRs as drafts for human
    # review. Set to "false" to open ready-for-review PRs (also overridable
    # at runtime via the dashboard Settings page).
    OPEN_PRS_AS_DRAFT: "true"
    # Automatic cost circuit breaker. When the runs-created-per-hour or the
    # estimated synthesis spend-per-day reaches one of these ceilings, the
    # agent trips into manual mode (new alerts park at `queued`) and stops
    # spending until an operator intervenes. 0 = disabled (the default — set
    # values tuned to your alert volume / budget). Runtime-overridable via the
    # dashboard Settings page.
    MAX_RUNS_PER_HOUR: "0"
    MAX_USD_PER_DAY: "0"
    # Loki stream labels probed (in order) to scope a log query to the
    # alerting workload — first one present on the alert wins. Override to
    # match how your log collector labels streams. Defaults cover Grafana
    # Alloy / Promtail with raw `app`, the `app.kubernetes.io/*` recommended
    # set, and the bare k8s identifiers. See the Alloy recipe in
    # docs/integration-recipes/alloy-logs.alloy for the matching collector
    # config.
    LOG_SCOPE_LABELS: "service,app,app_kubernetes_io_name,app_kubernetes_io_instance,container,pod,namespace,job"

  # Externally-managed credentials. Set this to the name of a Secret you
  # create outside the chart — via External Secrets Operator, Vault Agent, the
  # Secrets Store CSI driver, or by hand — and the chart renders NO Secret of
  # its own, pointing every reference at yours instead. The `secrets:` block
  # below is then ignored entirely and may be left at its placeholders.
  #
  # This is the GitOps path: a values file committed to a repo can name a
  # Secret, but must never contain one. It also avoids a Helm-vs-controller
  # ownership fight over the same Secret name, where Helm's drift detection
  # and the controller's refresh loop each revert the other on their own
  # interval.
  #
  # Expected keys (all optional — an absent key disables its feature with a
  # startup warning, exactly as an unset env var does today):
  #   ANTHROPIC_API_KEY, SLACK_WEBHOOK_URL, TEAMS_WEBHOOK_URL, GITHUB_TOKEN,
  #   GITHUB_REPO, LLOPSTER_API_TOKEN, LLOPSTER_LICENSE_KEY,
  #   AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_SESSION_TOKEN
  #
  # KNOWN GAP: the pod's checksum/secrets annotation is computed from the
  # `secrets:` values below, so it cannot detect a rotation inside an
  # externally-managed Secret — the agent will keep the old value until the
  # pod restarts. Pair this with a reloader (e.g. stakater/Reloader's
  # secret.reloader.stakater.com/reload annotation) if you rotate in place.
  existingSecret: ""

  # CHANGEME — placeholders, edit before installing. Stored in a k8s Secret.
  # IGNORED when agent.existingSecret is set.
  secrets:
    ANTHROPIC_API_KEY: CHANGEME-anthropic-api-key
    SLACK_WEBHOOK_URL: CHANGEME-https://hooks.slack.com/services/...
    # Microsoft Teams — only when agent.notifications.provider=teams. This is
    # the Power Automate "Workflows" incoming-webhook URL (the successor to the
    # retiring O365 connector). Leave empty for the Slack / none providers.
    TEAMS_WEBHOOK_URL: ""
    GITHUB_TOKEN: CHANGEME-github-pat
    GITHUB_REPO: CHANGEME-owner/repo
    # Shared secret guarding the inbound write surfaces (/webhook, trigger,
    # settings/license). EMPTY = auth DISABLED (a loud startup warning is
    # logged) — fine for local eval, but set a strong random value before
    # exposing the agent or dashboard on any untrusted network. AlertManager
    # must then send it as a bearer token; the dashboard reads the same secret
    # to authenticate its server-side proxy calls to the agent. A value pasted
    # in the dashboard (Settings → API access) overrides this at runtime.
    LLOPSTER_API_TOKEN: ""
    # Signed license JWT (paid tiers). Leave empty for the Community tier —
    # an empty key gates nothing and is the correct default for every
    # Community install. A key pasted in the dashboard (Settings → License)
    # overrides this at runtime without a redeploy. See src/agent/license.py.
    LLOPSTER_LICENSE_KEY: ""
    # OPTIONAL static AWS credentials — only a fallback for Bedrock on
    # clusters WITHOUT IRSA / pod-identity. Leave empty (the default) to use
    # the recommended keyless path: annotate agent.serviceAccount with an IAM
    # role ARN instead. When AWS_ACCESS_KEY_ID is set, AWS_SECRET_ACCESS_KEY
    # is required too; AWS_SESSION_TOKEN is only needed for temporary creds.
    # These are ignored entirely when agent.llm.provider != bedrock.
    AWS_ACCESS_KEY_ID: ""
    AWS_SECRET_ACCESS_KEY: ""
    AWS_SESSION_TOKEN: ""

  # GitHub target. Defaults to public github.com, so existing installs need
  # nothing here. Point both fields at a GitHub Enterprise Server instance to
  # open PRs against internal repos:
  #
  #   git:
  #     host: ghes.example-corp.net
  #
  # `host` drives the codebase-clone init container's credential rewrite;
  # `apiBase` drives the agent's REST calls (PR creation + the Settings page's
  # GitHub connection test). Leaving `apiBase` empty derives the GHES
  # convention `https://<host>/api/v3` automatically — set it explicitly only
  # if your instance serves the API somewhere else.
  #
  # Private CA: if your GHES presents a certificate signed by an internal CA,
  # mount the bundle with agent.extraVolumes / agent.extraVolumeMounts and set
  # SSL_CERT_FILE (agent, for httpx) and GIT_SSL_CAINFO (init container, for
  # git) via agent.extraEnv / agent.codebaseClone.extraEnv. See PRODUCTION.md.
  git:
    host: github.com
    apiBase: ""

  # Escape hatches for cluster-specific needs the chart doesn't model: extra
  # env vars and extra volumes on the agent container. `extraEnv` takes the
  # full EnvVar shape (so valueFrom/secretKeyRef works, unlike the `env` map
  # above, which is name/value only).
  extraEnv: []
  # Example — trust an internal CA for GHES over HTTPS:
  # extraEnv:
  #   - name: SSL_CERT_FILE
  #     value: /etc/ssl/corp/ca-bundle.crt
  extraVolumes: []
  # extraVolumes:
  #   - name: corp-ca
  #     configMap:
  #       name: corp-ca-bundle
  extraVolumeMounts: []
  # extraVolumeMounts:
  #   - name: corp-ca
  #     mountPath: /etc/ssl/corp
  #     readOnly: true

  # The init container that clones agent.codebases into /codebases before the
  # agent starts. Only rendered when agent.codebases is non-empty.
  codebaseClone:
    # Pinned by tag, not `latest`: a floating tag is not reproducible and
    # drifts under any policy that pins digests. v2.54.0 is the exact image
    # `alpine/git:latest` resolved to when this default was set (identical
    # digest), so pinning changed nothing about what gets pulled.
    #
    # Retag into your own registry for clusters that can only pull from a
    # private mirror:
    #   repository: <account>.dkr.ecr.<region>.amazonaws.com/mirror/alpine-git
    image:
      repository: alpine/git
      tag: v2.54.0
      pullPolicy: IfNotPresent

    # Extra env for the clone init container only. Separate from
    # agent.extraEnv because git needs GIT_SSL_CAINFO where httpx needs
    # SSL_CERT_FILE, and the init container should not inherit unrelated
    # agent env. agent.extraVolumes / agent.extraVolumeMounts are mounted
    # into BOTH containers, so one CA volume serves them together.
    extraEnv: []
    # extraEnv:
    #   - name: GIT_SSL_CAINFO
    #     value: /etc/ssl/corp/ca-bundle.crt

  # Per-service registry. Each key matches the `service` label on an alert;
  # `github_repo` is the repo LLopster opens PRs against; `codebase_path` is
  # where the agent reads source from (populated by the init-container
  # codebases clone below).
  #
  # Empty by default. Customer installs add their services here.
  servicesConfig: {}
  # Example:
  # servicesConfig:
  #   payments-api:
  #     codebase_path: /codebases/payments-api
  #     github_repo: my-org/payments-api

  # Init-container codebase clones — populates /codebases/<name> before
  # the agent starts. Each entry: name (matches servicesConfig key), the repo
  # to clone, and branch (optional, default "main").
  #
  # Name the repo either way:
  #   repo: my-org/payments-api   → derived as https://<agent.git.host>/<repo>.git
  #   gitRepo: https://…/x.git    → an explicit URL, which always wins
  # The `repo` shorthand exists so a GitHub Enterprise Server install names
  # its host ONCE (agent.git.host) instead of repeating it in every entry,
  # where it could drift from the host used for credential rewriting and the
  # REST API base. Use `gitRepo` for a repo on a different host than the rest.
  codebases: []
  # Example:
  # codebases:
  #   - name: payments-api
  #     repo: my-org/payments-api
  #     branch: main
  #   - name: legacy-svc
  #     gitRepo: https://github.com/other-org/legacy-svc.git

# ---------------------------------------------------------------------------
# llopster-dashboard (read-only UI — survives agent crash loops)
# Templates: templates/llopster-dashboard.yaml
# ---------------------------------------------------------------------------
dashboard:
  enabled: true

  image:
    repository: ghcr.io/synchrony-solutions/llopster
    # Empty ⇒ the template falls back to Chart.appVersion, so the default tag
    # always matches a published release image (push-images.sh publishes the
    # appVersion tag alongside `latest`). Set an explicit tag (e.g. a git SHA)
    # to pin a specific build.
    tag: ""
    pullPolicy: IfNotPresent

  replicas: 1

  service:
    type: ClusterIP
    port: 8000

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  # Security hardening — see the agent block above for rationale. The dashboard
  # is read-only and writes nothing to disk beyond /tmp scratch, so the
  # read-only root filesystem applies cleanly.
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL

  env:
    SERVICE: dashboard
    AGENT_URL: http://llopster-agent:8000
