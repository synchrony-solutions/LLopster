{{- if .Values.imagePullSecret.enabled }}
# Image pull secret for private registries (e.g. ghcr.io).
#
# Update the four fields under `imagePullSecret` in values.yaml:
#   registry: ghcr.io
#   username: <github username or org>
#   password: <github PAT with `read:packages` scope>
#   email:    <any email — required by the dockerconfigjson schema>
#
# Both the llopster-agent, llopster-dashboard, and demo-app Deployments reference this secret
# via spec.imagePullSecrets when imagePullSecret.enabled is true.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.imagePullSecret.name }}
  labels:
    {{- include "k3s-deployment.labels" . | nindent 4 }}
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: {{ dict "auths" (dict .Values.imagePullSecret.registry (dict
      "username" .Values.imagePullSecret.username
      "password" .Values.imagePullSecret.password
      "email"    .Values.imagePullSecret.email
      "auth"     (printf "%s:%s" .Values.imagePullSecret.username .Values.imagePullSecret.password | b64enc)
    )) | toJson | quote }}
{{- end }}
