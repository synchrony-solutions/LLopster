{{- if .Values.dashboard.enabled }}
---
# Dashboard Deployment — read-only UI, survives agent crash loops.
# Uses the same image as the agent; SERVICE=dashboard selects the process.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llopster-dashboard
  labels:
    {{- include "k3s-deployment.labels" . | nindent 4 }}
    app.kubernetes.io/component: dashboard
spec:
  replicas: {{ .Values.dashboard.replicas }}
  selector:
    matchLabels:
      app: llopster-dashboard
  template:
    metadata:
      labels:
        app: llopster-dashboard
        app.kubernetes.io/component: dashboard
    spec:
      {{- with .Values.dashboard.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.imagePullSecret.enabled }}
      imagePullSecrets:
        - name: {{ .Values.imagePullSecret.name }}
      {{- end }}
      containers:
        - name: dashboard
          image: "{{ .Values.dashboard.image.repository }}:{{ .Values.dashboard.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.dashboard.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
          env:
            {{- range $k, $v := .Values.dashboard.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            # Inbound-auth shared secret — the ONE secret the dashboard needs:
            # it enforces auth on its own settings/license routes and forwards
            # the token on server-side proxy calls to the agent. Sourced from
            # the agent's Secret (same value both pods must agree on). Optional
            # so a dashboard-only install doesn't fail to schedule.
            - name: LLOPSTER_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: llopster-agent
                  key: LLOPSTER_API_TOKEN
                  optional: true
            # DATABASE_URL points at the same PostgreSQL as the agent.
            # Built from the Bitnami postgresql subchart secret automatically.
            {{- if .Values.postgresql.enabled }}
            - name: DATABASE_URL
              value: "postgresql+asyncpg://{{ .Values.postgresql.auth.username }}:{{ .Values.postgresql.auth.password }}@llopster-postgres:5432/{{ .Values.postgresql.auth.database }}"
            {{- end }}
            # NOTE: dashboard deliberately does NOT mount the agent's Slack /
            # GitHub / Anthropic secrets. Connection status and test buttons
            # call the agent's /api/integrations/* endpoints over in-cluster
            # DNS — single source of truth for secrets, smaller blast radius.
            # AGENT_URL below tells the dashboard where to find that API.
            # Downward API — exposes pod/node identity to the /diagnostics page.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # Redirect any library that writes to $HOME to the writable tmp
            # emptyDir, since the root filesystem is mounted read-only.
            - name: HOME
              value: /tmp
          {{- with .Values.dashboard.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            # Writable scratch under a read-only root filesystem.
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.dashboard.resources | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: llopster-dashboard
  labels:
    {{- include "k3s-deployment.labels" . | nindent 4 }}
    app.kubernetes.io/component: dashboard
spec:
  type: {{ .Values.dashboard.service.type }}
  selector:
    app: llopster-dashboard
  ports:
    - name: http
      port: {{ .Values.dashboard.service.port }}
      targetPort: 8000
{{- end }}
