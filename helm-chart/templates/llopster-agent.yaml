{{- /*
  Secure-by-default gate. Evaluated UNCONDITIONALLY — it must run even when
  agent.enabled=false (a dashboard-only install still exposes settings/license/
  trigger/label write surfaces behind the dashboard Ingress), so it lives
  outside the `if .Values.agent.enabled` block below. If any inbound surface is
  exposed — via Ingress OR a Service of type LoadBalancer/NodePort (both are
  reachable from off-cluster) — and no shared secret is configured, refuse to
  render rather than ship an unauthenticated /webhook + trigger + settings/
  license behind a public address — those surfaces spend LLM money and hold a
  write-scoped GitHub PAT. Set agent.secrets.LLOPSTER_API_TOKEN to a strong
  random value (and have AlertManager send it as a bearer token — see
  helm-chart/docs/integration-recipes/alertmanager-receiver.yaml). For an
  explicitly trusted/local-only deploy, set agent.allowUnauthenticated=true to
  keep the no-token convenience (the agent still logs a loud startup warning).
*/ -}}
{{- $apiToken := dig "secrets" "LLOPSTER_API_TOKEN" "" .Values.agent -}}
{{- /* An externally-managed Secret satisfies the gate: the operator has taken
   ownership of the credentials, and the chart cannot see inside the Secret to
   verify the token is present. Without this, every External-Secrets install
   with an Ingress would hard-fail here — agent.secrets is empty by design in
   that mode. The agent still logs its loud startup warning if the token turns
   out to be genuinely absent at runtime, which is the check that can actually
   see the value. */ -}}
{{- $externallyManagedSecret := .Values.agent.existingSecret | default "" -}}
{{- $externalSvcTypes := list "LoadBalancer" "NodePort" -}}
{{- $agentSvcType := dig "service" "type" "ClusterIP" .Values.agent -}}
{{- $dashboardSvcType := dig "service" "type" "ClusterIP" .Values.dashboard -}}
{{- $agentExposed := or (dig "services" "agent" "enabled" false .Values.ingress) (has $agentSvcType $externalSvcTypes) -}}
{{- $dashboardExposed := or (dig "services" "dashboard" "enabled" false .Values.ingress) (has $dashboardSvcType $externalSvcTypes) -}}
{{- if and (or $agentExposed $dashboardExposed) (not $apiToken) (not $externallyManagedSecret) (not .Values.agent.allowUnauthenticated) -}}
{{- fail "Refusing to render: the agent or dashboard is exposed (Ingress enabled, or a Service of type LoadBalancer/NodePort) but agent.secrets.LLOPSTER_API_TOKEN is empty, which would expose /webhook, the trigger routes, and settings/license UNAUTHENTICATED while holding a write-scoped GitHub PAT. Set agent.secrets.LLOPSTER_API_TOKEN to a strong random value (AlertManager must then send it as a bearer token — see helm-chart/docs/integration-recipes/alertmanager-receiver.yaml), or deliver credentials through an external secret manager via agent.existingSecret. For an explicitly trusted/local-only deploy, set agent.allowUnauthenticated=true." -}}
{{- end -}}
{{- /*
  Database gate. Also unconditional — the dashboard needs a DATABASE_URL just
  as much as the agent, so a dashboard-only install must not slip past it.

  With the bundled PostgreSQL off, DATABASE_URL used to simply never be set:
  the app fell back to SQLite under /app/data, and that write fails against
  this chart's own readOnlyRootFilesystem: true. The documented escape hatch
  was unusable in practice, and the failure surfaced as a confusing runtime
  crash-loop rather than an install-time error. Fail here instead, while the
  operator is still looking at their values file.
*/ -}}
{{- if not .Values.postgresql.enabled -}}
{{- $extDbSecret := dig "existingSecret" "" (.Values.externalDatabase | default dict) -}}
{{- if not $extDbSecret -}}
{{- /* Checked PER COMPONENT, not "either one". The agent and the dashboard
   are separate pods that each open their own connection, so an
   agent.env.DATABASE_URL passthrough alone still leaves the dashboard on the
   broken SQLite fallback. externalDatabase.existingSecret covers both at
   once, which is why it is the recommended path. */ -}}
{{- if and .Values.agent.enabled (not (dig "env" "DATABASE_URL" "" .Values.agent)) -}}
{{- fail "Refusing to render: postgresql.enabled=false but the agent has no database configured, so it would fall back to a SQLite file under /app/data — a write that fails against the chart's readOnlyRootFilesystem. Set externalDatabase.existingSecret (a Secret holding a DATABASE_URL key, e.g. an RDS connection string delivered by External Secrets — this covers the agent and dashboard together) or, if you accept the connection string being readable in the PodSpec, agent.env.DATABASE_URL." -}}
{{- end -}}
{{- if and .Values.dashboard.enabled (not (dig "env" "DATABASE_URL" "" .Values.dashboard)) -}}
{{- fail "Refusing to render: postgresql.enabled=false but the dashboard has no database configured, so it would fall back to a SQLite file under /app/data — a write that fails against the chart's readOnlyRootFilesystem. The dashboard is a separate pod with its own connection, so an agent-only DATABASE_URL is not enough. Set externalDatabase.existingSecret (a Secret holding a DATABASE_URL key — this covers both components) or, if you accept the connection string being readable in the PodSpec, dashboard.env.DATABASE_URL as well." -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- if .Values.agent.enabled }}
{{- if not .Values.agent.existingSecret }}
---
# Sensitive credentials consumed by the agent. Edit the values under
# `agent.secrets` in values.yaml before installing — they're committed
# as Secret stringData here so Helm can manage them with the rest of the
# release. Rotate via `helm upgrade` after editing values.
#
# NOT rendered when agent.existingSecret is set — in that mode an external
# secret manager owns the Secret and Helm must never write it, or Helm's
# drift detection and the external controller's refresh loop each revert
# the other on their own interval.
apiVersion: v1
kind: Secret
metadata:
  name: llopster-agent
  labels:
    {{- include "k3s-deployment.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent
type: Opaque
stringData:
  ANTHROPIC_API_KEY: {{ .Values.agent.secrets.ANTHROPIC_API_KEY | quote }}
  SLACK_WEBHOOK_URL: {{ .Values.agent.secrets.SLACK_WEBHOOK_URL | quote }}
  {{- /* Teams Workflows webhook URL. Required when notifications.provider=teams
     (render fails otherwise, mirroring the Bedrock region guard); otherwise
     emitted only when set. */ -}}
  {{- if eq (.Values.agent.notifications.provider | default "slack") "teams" }}
  TEAMS_WEBHOOK_URL: {{ required "agent.secrets.TEAMS_WEBHOOK_URL is required when agent.notifications.provider=teams" .Values.agent.secrets.TEAMS_WEBHOOK_URL | quote }}
  {{- else if .Values.agent.secrets.TEAMS_WEBHOOK_URL }}
  TEAMS_WEBHOOK_URL: {{ .Values.agent.secrets.TEAMS_WEBHOOK_URL | quote }}
  {{- end }}
  GITHUB_TOKEN: {{ .Values.agent.secrets.GITHUB_TOKEN | quote }}
  GITHUB_REPO: {{ .Values.agent.secrets.GITHUB_REPO | quote }}
  LLOPSTER_LICENSE_KEY: {{ .Values.agent.secrets.LLOPSTER_LICENSE_KEY | default "" | quote }}
  LLOPSTER_API_TOKEN: {{ .Values.agent.secrets.LLOPSTER_API_TOKEN | default "" | quote }}
  {{- /* Static AWS credentials — OPTIONAL Bedrock fallback for clusters
     without IRSA / pod-identity. Only emitted when set, so the recommended
     IRSA path (agent.serviceAccount.annotations) leaves no keys at rest. */ -}}
  {{- if .Values.agent.secrets.AWS_ACCESS_KEY_ID }}
  AWS_ACCESS_KEY_ID: {{ .Values.agent.secrets.AWS_ACCESS_KEY_ID | quote }}
  AWS_SECRET_ACCESS_KEY: {{ required "agent.secrets.AWS_SECRET_ACCESS_KEY is required when AWS_ACCESS_KEY_ID is set" .Values.agent.secrets.AWS_SECRET_ACCESS_KEY | quote }}
  {{- end }}
  {{- if .Values.agent.secrets.AWS_SESSION_TOKEN }}
  AWS_SESSION_TOKEN: {{ .Values.agent.secrets.AWS_SESSION_TOKEN | quote }}
  {{- end }}
{{- end }}
---
{{- if .Values.agent.serviceAccount.create }}
# ServiceAccount for the agent pod. Its primary job is to carry the IRSA /
# pod-identity annotation that grants Bedrock (`bedrock:InvokeModel`) access
# when agent.llm.provider=bedrock — the recommended keyless credential path
# on EKS. Harmless for the direct Anthropic API provider (no annotations).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "llopster.agent.serviceAccountName" . }}
  labels:
    {{- include "k3s-deployment.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent
  {{- with .Values.agent.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
---
{{- end }}
# services.yaml — maps `service` label on alerts to a codebase path and
# GitHub repo. Mirrors config/services.yaml. Edit the
# `agent.servicesConfig` map in values.yaml to add more services.
apiVersion: v1
kind: ConfigMap
metadata:
  name: llopster-agent-services
  labels:
    {{- include "k3s-deployment.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent
data:
  services.yaml: |
    {{- /*
      Render each entry wholesale rather than enumerating known keys. The
      registry (src/services_registry.py) accepts optional per-service blocks
      — `pack`, `delivery`, `chart_lineage` — and a field-by-field template
      silently DROPS every one of them, so a values file that looks correct
      produces a services.yaml missing the declaration. `toYaml` passes
      through whatever the operator declared; the registry validates it and
      warns on anything malformed.
    */}}
    {{- range $name, $cfg := .Values.agent.servicesConfig }}
    {{ $name }}:
      {{- toYaml $cfg | nindent 6 }}
    {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llopster-agent
  labels:
    {{- include "k3s-deployment.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent
spec:
  replicas: {{ .Values.agent.replicas }}
  selector:
    matchLabels:
      app: llopster-agent
  template:
    metadata:
      labels:
        app: llopster-agent
        app.kubernetes.io/component: agent
      annotations:
        # Roll the pod when the services ConfigMap or credentials Secret change.
        checksum/services: {{ .Values.agent.servicesConfig | toYaml | sha256sum }}
        checksum/secrets: {{ .Values.agent.secrets | toYaml | sha256sum }}
    spec:
      serviceAccountName: {{ include "llopster.agent.serviceAccountName" . }}
      {{- with .Values.agent.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.imagePullSecret.enabled }}
      imagePullSecrets:
        - name: {{ .Values.imagePullSecret.name }}
      {{- end }}
      {{- if .Values.agent.codebases }}
      # Init container clones each configured codebase into the shared
      # /codebases volume so the agent's PatchGenerator can read source
      # at runtime (services.yaml entries point at /codebases/<name>).
      initContainers:
        - name: clone-codebases
          image: "{{ dig "codebaseClone" "image" "repository" "alpine/git" .Values.agent }}:{{ dig "codebaseClone" "image" "tag" "v2.54.0" .Values.agent }}"
          imagePullPolicy: {{ dig "codebaseClone" "image" "pullPolicy" "IfNotPresent" .Values.agent }}
          command:
            - sh
            - -c
            - |
              set -euo pipefail
              GIT_HOST="{{ include "llopster.github.host" . }}"
              git config --global url."https://x-access-token:${GITHUB_TOKEN}@${GIT_HOST}/".insteadOf "https://${GIT_HOST}/"
              {{- range .Values.agent.codebases }}
              rm -rf /codebases/{{ .name }}
              REPO_URL="{{ include "llopster.codebase.url" (dict "ctx" $ "cb" .) }}"
              # Use the GITHUB_TOKEN unless it is absent or still the chart's
              # CHANGEME placeholder (the placeholder produced a malformed auth
              # header that made git return HTTP 400).  We deliberately do NOT
              # gate on a token prefix: GitHub Enterprise Server admins can
              # configure their own prefixes and older GHES PATs are bare
              # 40-char hex, so a prefix allowlist silently downgrades a valid
              # enterprise token to an anonymous clone that then fails against
              # a private repo with a confusing error.  The prefix check
              # survives only as a hint in the log line below.
              if [ -n "${GITHUB_TOKEN:-}" ] && \
                 [ "${GITHUB_TOKEN#CHANGEME}" = "${GITHUB_TOKEN}" ]; then
                if echo "${GITHUB_TOKEN}" | grep -qE "^(ghp_|github_pat_|gho_|ghs_|ghu_)"; then
                  echo "Using GITHUB_TOKEN for git clone auth (recognized github.com token prefix)"
                else
                  echo "Using GITHUB_TOKEN for git clone auth (unrecognized prefix — expected for GitHub Enterprise Server)"
                fi
                REPO_URL=$(echo "$REPO_URL" | sed "s|https://|https://${GITHUB_TOKEN}@|")
              else
                echo "GITHUB_TOKEN missing or placeholder; cloning anonymously (works only for public repos)"
              fi
              git clone --depth 1 --branch {{ .branch | default "main" }} "$REPO_URL" /codebases/{{ .name }}
              {{- end }}
          env:
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef: { name: llopster-agent, key: GITHUB_TOKEN }
            # Runs under the non-root pod securityContext, so $HOME must be a
            # writable path for `git config --global` to land its .gitconfig.
            - name: HOME
              value: /tmp
            {{- /* Init-container-only extras — e.g. GIT_SSL_CAINFO pointing at
               a corporate CA bundle mounted via agent.extraVolumes, which a
               private GitHub Enterprise Server over HTTPS requires. */ -}}
            {{- with dig "codebaseClone" "extraEnv" (list) .Values.agent }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.agent.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: codebases
              mountPath: /codebases
            # Writable scratch for HOME/.gitconfig under a read-only root fs.
            - name: tmp
              mountPath: /tmp
            {{- /* Same extra mounts as the agent container, so a single CA
               bundle volume serves both git (here) and httpx (there). */ -}}
            {{- with .Values.agent.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      {{- end }}
      containers:
        - name: agent
          image: "{{ .Values.agent.image.repository }}:{{ .Values.agent.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.agent.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
          env:
            {{- range $k, $v := .Values.agent.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            # PROMETHEUS_URL / LOKI_URL — derived from the top-level
            # `prometheus` and `loki` blocks so a single switch flips both
            # the subchart install and the agent's connection target.
            - name: PROMETHEUS_URL
              value: {{ if .Values.prometheus.bundled -}}
                "http://prometheus-server:80"
              {{- else -}}
                {{ required "prometheus.url is required when prometheus.bundled=false" .Values.prometheus.url | quote }}
              {{- end }}
            - name: LOKI_URL
              value: {{ if .Values.loki.bundled -}}
                "http://loki:3100"
              {{- else -}}
                {{ required "loki.url is required when loki.bundled=false" .Values.loki.url | quote }}
              {{- end }}
            - name: ANTHROPIC_API_KEY
              valueFrom:
                {{- include "llopster.agent.secretKeyRef" (dict "ctx" $ "key" "ANTHROPIC_API_KEY") | nindent 16 }}
            # LLM provider selector. "anthropic" (default) uses the direct
            # API + ANTHROPIC_API_KEY above; "bedrock" routes Claude through
            # AWS Bedrock. See agent.llm in values.yaml.
            - name: LLM_PROVIDER
              value: {{ .Values.agent.llm.provider | default "anthropic" | quote }}
            {{- if eq (.Values.agent.llm.provider | default "anthropic") "bedrock" }}
            # --- Bedrock provider config ---
            # Region is required (Bedrock is regional). Credentials resolve
            # via the pod's ServiceAccount IRSA role (recommended) or the
            # optional static AWS_* keys below.
            - name: AWS_REGION
              value: {{ required "agent.llm.bedrock.region is required when agent.llm.provider=bedrock" .Values.agent.llm.bedrock.region | quote }}
            # Bedrock inference-profile model IDs (differ from the direct-API
            # names). Override to match what's enabled in your account/region.
            - name: BEDROCK_MODEL
              value: {{ .Values.agent.llm.bedrock.model | quote }}
            - name: BEDROCK_TRIAGE_MODEL
              value: {{ .Values.agent.llm.bedrock.triageModel | quote }}
            - name: BEDROCK_INVESTIGATION_MODEL
              value: {{ .Values.agent.llm.bedrock.investigationModel | quote }}
            {{- /* Static-key fallback (non-IRSA clusters). Absent → the boto3
               credential chain (IRSA / instance profile) is used instead.
               With an externally-managed Secret the chart cannot see whether
               these keys exist, so it emits optional refs unconditionally:
               present keys are picked up, absent ones are ignored by the
               kubelet. Gating on agent.secrets here would have silently
               dropped static keys that DO live in the external Secret. */ -}}
            {{- if or (dig "secrets" "AWS_ACCESS_KEY_ID" "" .Values.agent) .Values.agent.existingSecret }}
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                {{- include "llopster.agent.secretKeyRef" (dict "ctx" $ "key" "AWS_ACCESS_KEY_ID") | nindent 16 }}
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                {{- include "llopster.agent.secretKeyRef" (dict "ctx" $ "key" "AWS_SECRET_ACCESS_KEY") | nindent 16 }}
            {{- end }}
            {{- if or (dig "secrets" "AWS_SESSION_TOKEN" "" .Values.agent) .Values.agent.existingSecret }}
            - name: AWS_SESSION_TOKEN
              valueFrom:
                {{- include "llopster.agent.secretKeyRef" (dict "ctx" $ "key" "AWS_SESSION_TOKEN") | nindent 16 }}
            {{- end }}
            {{- end }}
            # Notification channel: slack (default) | teams | none. See
            # agent.notifications in values.yaml.
            - name: NOTIFIER_PROVIDER
              value: {{ .Values.agent.notifications.provider | default "slack" | quote }}
            - name: SLACK_WEBHOOK_URL
              valueFrom:
                {{- include "llopster.agent.secretKeyRef" (dict "ctx" $ "key" "SLACK_WEBHOOK_URL") | nindent 16 }}
            {{- if eq (.Values.agent.notifications.provider | default "slack") "teams" }}
            - name: TEAMS_WEBHOOK_URL
              valueFrom:
                {{- include "llopster.agent.secretKeyRef" (dict "ctx" $ "key" "TEAMS_WEBHOOK_URL") | nindent 16 }}
            {{- end }}
            - name: GITHUB_TOKEN
              valueFrom:
                {{- include "llopster.agent.secretKeyRef" (dict "ctx" $ "key" "GITHUB_TOKEN") | nindent 16 }}
            - name: GITHUB_REPO
              valueFrom:
                {{- include "llopster.agent.secretKeyRef" (dict "ctx" $ "key" "GITHUB_REPO") | nindent 16 }}
            # GitHub REST API root — derived from agent.git (see the helper),
            # NOT set in agent.env, so it can't drift from the git host the
            # clone init container rewrites. Defaults to the public
            # https://api.github.com; a GHES install resolves to
            # https://<host>/api/v3.
            - name: GITHUB_API_BASE
              value: {{ include "llopster.github.apiBase" . | quote }}
            # License key (paid-feature gate). Source of truth; the dashboard
            # Settings page can override it at runtime via the license_key
            # Setting. Empty = Community tier (gates nothing).
            - name: LLOPSTER_LICENSE_KEY
              valueFrom:
                {{- include "llopster.agent.secretKeyRef" (dict "ctx" $ "key" "LLOPSTER_LICENSE_KEY") | nindent 16 }}
            # Shared secret for inbound-surface auth (/webhook, trigger). Empty
            # disables the check (a loud startup warning is logged).
            - name: LLOPSTER_API_TOKEN
              valueFrom:
                {{- include "llopster.agent.secretKeyRef" (dict "ctx" $ "key" "LLOPSTER_API_TOKEN") | nindent 16 }}
            {{- /* DATABASE_URL always arrives by reference, never as a literal.
               Interpolating the password into the PodSpec (as this did) leaks
               it to `kubectl describe pod`, to `helm get values`, and into any
               rendered manifest a GitOps controller stores. */ -}}
            {{- include "llopster.databaseUrlEnv" . | nindent 12 }}
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # Redirect any library that writes to $HOME to the writable tmp
            # emptyDir, since the root filesystem is mounted read-only.
            - name: HOME
              value: /tmp
            {{- /* Full-shape EnvVar escape hatch (valueFrom works here, unlike
               the name/value-only agent.env map). Last in the list so an
               operator can override a derived value above if they must. */ -}}
            {{- with .Values.agent.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.agent.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: services-config
              mountPath: /etc/llopster
              readOnly: true
            # Writable scratch (tempfiles, HTTP client spool) under a
            # read-only root filesystem.
            - name: tmp
              mountPath: /tmp
            {{- if .Values.agent.codebases }}
            - name: codebases
              mountPath: /codebases
              readOnly: true
            {{- end }}
            {{- with .Values.agent.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          # /health is a DB-free 200 — safe as a liveness target so a
          # transient Postgres outage doesn't restart-loop the pod that
          # receives AlertManager webhooks. Without these, a wedged agent is
          # never restarted and stays in the Service endpoints while
          # AlertManager keeps firing into it. Cadence matches the dashboard.
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.agent.resources | nindent 12 }}
      volumes:
        - name: services-config
          configMap:
            name: llopster-agent-services
        - name: tmp
          emptyDir: {}
        {{- if .Values.agent.codebases }}
        - name: codebases
          emptyDir: {}
        {{- end }}
        {{- /* Mounted into BOTH the clone init container and the agent — a
           corporate CA bundle for a private GitHub Enterprise Server is
           needed by git and httpx alike. */ -}}
        {{- with .Values.agent.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: llopster-agent
  labels:
    {{- include "k3s-deployment.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent
spec:
  type: {{ .Values.agent.service.type }}
  selector:
    app: llopster-agent
  ports:
    - name: http
      port: {{ .Values.agent.service.port }}
      targetPort: 8000
{{- end }}
