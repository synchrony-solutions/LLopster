# Copy to values.secret.yaml (gitignored) and fill in real values before
# installing. Layered on top of values.yaml via `helm install/upgrade -f`.

agent:
  secrets:
    ANTHROPIC_API_KEY: "sk-ant-XXXXXXXXXXXXXXXXXXXXXXXXXXXX"
    SLACK_WEBHOOK_URL: "https://hooks.slack.com/services/T00000000/B00000000/XXXXXXXXXXXXXXXX"
    # Real PAT — required to clone private codebases in init containers
    # and to open PRs against your service repos. Needs `repo` scope
    # (classic) or `Contents: RW` + `Pull requests: RW` (fine-grained) on
    # every repo listed in agent.servicesConfig.
    GITHUB_TOKEN: "github_pat_XXXXXXXXXXXXXXXXXXX"
    # Fallback `owner/repo` used when an alert's `service` label doesn't
    # match any servicesConfig entry. Leave as a placeholder if you'd
    # rather LLopster skip those alerts.
    GITHUB_REPO: "my-org/my-fallback-repo"
    LLOPSTER_LICENSE_KEY: "xxxxyyy-zzzz-1234-5678-abcdefghijklmnop"
    # Inbound-auth shared secret. Guards /webhook, the trigger routes, and the
    # dashboard settings/license mutations. EMPTY = auth DISABLED (a loud
    # startup warning is logged) — fine for local/trusted networks, but set a
    # strong random value for anything exposed. AlertManager must then send it
    # as a bearer token (see README → "Securing the inbound surfaces"). The
    # dashboard reads this same key to authenticate its proxy calls to the
    # agent. Once set, changing it from the dashboard requires the current
    # token — see SECURITY.md and the README for the set-once bootstrap.
    LLOPSTER_API_TOKEN: ""
postgresql:
  auth:
    password: "choose-a-strong-password"

# Only needed if pulling images from a private registry (e.g. ghcr.io).
# Flip imagePullSecret.enabled=true in values.yaml when using this.
imagePullSecret:
  registry: ghcr.io
  username: YOUR_GITHUB_USERNAME
  password: ghp_XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
  email: whatever@email.com
